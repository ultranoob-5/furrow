name: Build and Release Firmware

# Runs automatically whenever a version tag (v0.3.0, v1.2.0, etc.) is
# pushed - the exact moment described in CHANGELOG.md's "how to cut a
# release" checklist. Builds the firmware with PlatformIO and attaches
# the resulting .bin to a GitHub Release for that tag, creating the
# release if it doesn't already exist.
on:
  push:
    tags:
      - 'v*'

# Explicit, not relying on the repo's default token permissions - newer
# repos default GITHUB_TOKEN to read-only, which silently blocks
# softprops/action-gh-release from creating the release (403: "Resource
# not accessible by integration"). This is self-contained in the
# workflow itself rather than a repo Settings toggle someone could
# forget or accidentally reset later.
permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Generate secrets.h from repository secrets
        run: |
          cat > include/secrets.h << EOF
          #pragma once
          namespace Config
          {
              constexpr const char* API_KEY = "${{ secrets.FIREBASE_API_KEY }}";
              constexpr const char* DATABASE_URL = "${{ secrets.FIREBASE_DATABASE_URL }}";
              constexpr const char* DEVICE_AUTH_EMAIL = "${{ secrets.DEVICE_AUTH_EMAIL }}";
              constexpr const char* DEVICE_AUTH_PASSWORD = "${{ secrets.DEVICE_AUTH_PASSWORD }}";
              constexpr const char* WHAPI_TOKEN = "${{ secrets.WHAPI_TOKEN }}";
          }
          EOF
        # Never echo/print this file's contents anywhere in the log -
        # GitHub Actions masks known secret values automatically, but
        # there's no reason to tempt that by printing it regardless.

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Cache PlatformIO packages
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            .pio
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build firmware
        run: pio run -e esp32dev

      - name: Rename output for a stable, predictable asset name
        run: cp .pio/build/esp32dev/firmware.bin firmware.bin

      - name: Extract the full flash set (for first-time/blank-chip flashing)
        run: |
          # firmware.bin alone (above) is only sufficient for OTA-style
          # updates, where a bootloader and partition table are already
          # on the device from an earlier full flash. The web flasher
          # (web/flash.html) needs the complete set a blank, never-
          # before-programmed ESP32 actually requires - these three are
          # what any full flash (PlatformIO's own `pio run -t upload`
          # included) writes alongside firmware.bin.
          cp .pio/build/esp32dev/bootloader.bin bootloader.bin
          cp .pio/build/esp32dev/partitions.bin partitions.bin

          # boot_app0.bin isn't project-built - it's a fixed file that
          # initializes the OTA-select partition so the bootloader knows
          # to boot the app just written. Its actual location/name isn't
          # as stable across platformio's espressif32 platform versions
          # as first assumed - platformio.ini doesn't pin a version, so
          # this build could be on the newer ESP-IDF-based Arduino Core
          # 3.x, which restructured the whole build system; ESP-IDF's own
          # native name for the same file is ota_data_initial.bin, not
          # boot_app0.bin, and newer builds sometimes already copy it
          # straight into the build output directory rather than only
          # living in the installed framework package.
          #
          # Checks the most likely spots first, under both names, before
          # falling back to a broad, unrestricted search - and if even
          # that comes up empty, dumps enough real information (the full
          # build output directory, every .bin file under ~/.platformio
          # matching either name) to fix this correctly on the next
          # attempt instead of guessing blind a third time.
          BOOT_APP0=""
          for CANDIDATE in \
            ".pio/build/esp32dev/boot_app0.bin" \
            ".pio/build/esp32dev/ota_data_initial.bin"
          do
            if [ -f "$CANDIDATE" ]; then
              BOOT_APP0="$CANDIDATE"
              break
            fi
          done

          if [ -z "$BOOT_APP0" ]; then
            BOOT_APP0=$(find ~/.platformio \( -name "boot_app0.bin" -o -name "ota_data_initial.bin" \) 2>/dev/null | head -n1)
          fi

          if [ -z "$BOOT_APP0" ]; then
            echo "::error::boot_app0.bin/ota_data_initial.bin not found in the build output or anywhere under ~/.platformio"
            echo "--- Diagnostic: full contents of .pio/build/esp32dev/ ---"
            ls -la .pio/build/esp32dev/ || echo "(directory doesn't exist)"
            echo "--- Diagnostic: any .bin file under ~/.platformio matching boot/ota by name ---"
            find ~/.platformio -iname "*boot_app0*" -o -iname "*ota_data_initial*" 2>/dev/null
            exit 1
          fi

          echo "Found boot_app0/ota_data_initial at: $BOOT_APP0"
          cp "$BOOT_APP0" boot_app0.bin

          echo "Flash set ready:"
          ls -la bootloader.bin partitions.bin boot_app0.bin firmware.bin

      - name: Extract changelog section for this release
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="## [$VERSION]" '
            index($0, ver) == 1 { found=1; print; next }
            found && (index($0, "## ") == 1 || index($0, "---") == 1) { exit }
            found { print }
          ' CHANGELOG.md > release_notes.md

          if [ ! -s release_notes.md ]; then
            echo "::warning::No CHANGELOG.md section found for version $VERSION - using a fallback release body. Add a '## [$VERSION]' entry to CHANGELOG.md next time before tagging."
            echo "Release $VERSION (no matching CHANGELOG.md entry was found for this version)." > release_notes.md
          fi

          echo "--- Release notes for this build ---"
          cat release_notes.md

      - name: Create/update GitHub Release with firmware attached
        uses: softprops/action-gh-release@v3
        with:
          files: |
            firmware.bin
            bootloader.bin
            partitions.bin
            boot_app0.bin
          body_path: release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
